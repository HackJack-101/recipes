services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: recipes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Image published by the GitHub Action (docker compose pull), or built locally (--build).
    image: ${APP_IMAGE:-ghcr.io/hackjack-101/recipes:latest}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        GIT_REPO: ${GIT_REPO:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://recipes:${POSTGRES_PASSWORD}@db:5432/recipes
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      UPLOAD_DIR: /data/uploads
      # Set to true once behind HTTPS ("Secure" session cookie)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
